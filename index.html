<body>

<header>
  <div class="brand">
    <div class="brand-title">
      <span class="live-dot"></span>
      <span>GS SHOP CCTV 실시간 관제센터</span>
    </div>
    <div class="brand-sub" id="subText">대표CCTV 데이터 로딩 중…</div>
  </div>

  <div class="controls">
    <span class="status-pill" id="countText">-</span>
    <span class="status-pill" id="refreshText">자동새로고침 60초</span>
    <button class="btn" id="reloadBtn">전체 리로드</button>
    <button class="btn on" id="autoBtn">자동새로고침 ON</button>
    <button class="btn" id="fitBtn">화면맞춤</button>
  </div>
</header>

<main class="dashboard" id="dashboard"></main>
<div class="toast" id="toast"></div>

<script>
/**
 * 대표CCTV 시트 CSV
 * 권장 컬럼:
 * region | url | note | cctvName | coordX | coordY | updatedAt
 */
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTZZaK8GDz_FZsefh-XoCkPmQhKOugjSRNioC5M8fAUH87iiyQV8KK28wCVN4_dbWJukM-Rbwkkbz_G/pub?gid=1422576665&single=true&output=csv";

const dashboard = document.getElementById("dashboard");
const subText = document.getElementById("subText");
const countText = document.getElementById("countText");
const refreshText = document.getElementById("refreshText");
const reloadBtn = document.getElementById("reloadBtn");
const autoBtn = document.getElementById("autoBtn");
const fitBtn = document.getElementById("fitBtn");
const toast = document.getElementById("toast");

let items = [];
let autoRefresh = true;
let refreshSec = 60;
let refreshTimer = null;
let fitMode = false;
let hlsPlayers = [];

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

function escapeHtml(s){
  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(s){
  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let cur = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const n = text[i + 1];

    if (c === '"' && inQuotes && n === '"') {
      cur += '"';
      i++;
      continue;
    }

    if (c === '"') {
      inQuotes = !inQuotes;
      continue;
    }

    if (c === "," && !inQuotes) {
      row.push(cur);
      cur = "";
      continue;
    }

    if ((c === "\n" || c === "\r") && !inQuotes) {
      if (c === "\r" && n === "\n") i++;
      row.push(cur);
      cur = "";

      if (row.some(v => String(v || "").trim() !== "")) rows.push(row);
      row = [];
      continue;
    }

    cur += c;
  }

  if (cur.length || row.length) {
    row.push(cur);
    if (row.some(v => String(v || "").trim() !== "")) rows.push(row);
  }

  return rows;
}

function normalizeHeader(h){
  return String(h || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[\u200b-\u200d\uFEFF]/g,"");
}

function mapRows(rows){
  if (!rows || rows.length < 2) return [];

  const header = rows[0];
  const idx = {};

  header.forEach((h, i) => {
    idx[normalizeHeader(h)] = i;
  });

  const iRegion = idx["region"] ?? idx["권역"] ?? idx["지역"] ?? 0;
  const iUrl = idx["url"] ?? idx["링크"] ?? idx["cctv"] ?? idx["주소"] ?? 1;
  const iNote = idx["note"] ?? idx["비고"] ?? idx["설명"] ?? 2;
  const iName = idx["cctvname"] ?? idx["cctv명"] ?? idx["이름"] ?? 3;
  const iUpdated = idx["updatedat"] ?? idx["갱신일시"] ?? idx["수정일시"] ?? 6;

  return rows.slice(1)
    .map(r => ({
      region: String(r[iRegion] ?? "").trim(),
      url: String(r[iUrl] ?? "").trim(),
      note: String(r[iNote] ?? "").trim(),
      name: String(r[iName] ?? "").trim(),
      updatedAt: String(r[iUpdated] ?? "").trim()
    }))
    .filter(x => x.region && x.url);
}

function withCacheBust(url){
  if (!url) return "";

  try{
    const u = new URL(url);
    u.searchParams.set("_t", Date.now());
    return u.toString();
  }catch(e){
    return url + (url.includes("?") ? "&" : "?") + "_t=" + Date.now();
  }
}

function isHlsUrl(url){
  const u = String(url || "").toLowerCase();
  return u.includes(".m3u8") || u.includes("m3u8");
}

function isUticPageUrl(url){
  const u = String(url || "").toLowerCase();
  return u.includes("utic.go.kr") || u.includes("www.utic.go.kr");
}

function clearHlsPlayers(){
  hlsPlayers.forEach(hls => {
    try{ hls.destroy(); }catch(e){}
  });
  hlsPlayers = [];
}

function getMode(item){
  if (isHlsUrl(item.url)) return "HLS";
  if (isUticPageUrl(item.url)) return "UTIC";
  return "WEB";
}

function getBadgeClass(mode){
  if (mode === "HLS") return "ok";
  if (mode === "UTIC") return "warn";
  return "web";
}

function buildCard(item, index){
  const card = document.createElement("section");
  card.className = "card";

  const label = item.name || item.note || "CCTV";
  const mode = getMode(item);
  const badgeClass = getBadgeClass(mode);

  card.innerHTML = `
    <div class="card-head">
      <div class="meta">
        <div class="region">${escapeHtml(item.region)}</div>
        <div class="note">${escapeHtml(label)}</div>
      </div>
      <div class="card-actions">
        <a class="small-btn" href="${escapeAttr(item.url)}" target="_blank" rel="noopener noreferrer">새창</a>
        <button class="small-btn" data-action="reload">리로드</button>
      </div>
    </div>

    <div class="screen" id="screen_${index}">
      <div class="loading">CCTV 연결 중…</div>

      <div class="utic-box" id="utic_${index}">
        <div class="info-inner">
          <b>UTIC 새창 확인 필요</b>
          <p>
            국가교통정보센터 페이지는 보안 정책상 외부 화면에 삽입하면
            “비정상적인 접근”으로 차단될 수 있습니다.<br>
            실시간 CCTV는 새창에서 확인해 주세요.
          </p>
          <a class="small-btn" href="${escapeAttr(item.url)}" target="_blank" rel="noopener noreferrer">새창으로 보기</a>
        </div>
      </div>

      <div class="error-box" id="err_${index}">
        <div class="info-inner">
          <b>화면 내 재생 제한</b>
          <p>
            CCTV URL 형식 또는 제공 사이트 정책에 따라 관제센터 내부 재생이 안 될 수 있습니다.<br>
            아래 버튼으로 새창 확인을 권장합니다.
          </p>
          <a class="small-btn" href="${escapeAttr(item.url)}" target="_blank" rel="noopener noreferrer">새창으로 보기</a>
        </div>
      </div>
    </div>

    <div class="card-foot">
      <span class="badge ${badgeClass}">${mode}</span>
      <span>${escapeHtml(item.updatedAt || "실시간 연결")}</span>
    </div>
  `;

  card.querySelector('[data-action="reload"]').addEventListener("click", () => {
    reloadOne(card, item, index);
  });

  return card;
}

function mountViewer(card, item, index){
  const screen = card.querySelector(`#screen_${index}`);
  const loading = screen.querySelector(".loading");
  const errorBox = screen.querySelector(`#err_${index}`);
  const uticBox = screen.querySelector(`#utic_${index}`);

  if (!screen) return;

  const oldFrame = screen.querySelector("iframe");
  const oldVideo = screen.querySelector("video");

  if (oldFrame) oldFrame.remove();
  if (oldVideo) oldVideo.remove();

  loading.style.display = "flex";
  errorBox.classList.remove("show");
  uticBox.classList.remove("show");

  const url = withCacheBust(item.url);

  /**
   * ✅ 중요:
   * UTIC 웹페이지는 iframe 삽입 시 "비정상적인 접근" 팝업이 뜸.
   * 따라서 UTIC 페이지는 관제센터 내부 재생을 시도하지 않고 새창 안내만 표시.
   */
  if (isUticPageUrl(item.url) && !isHlsUrl(item.url)) {
    loading.style.display = "none";
    uticBox.classList.add("show");
    return;
  }

  /**
   * m3u8 영상 URL이면 HLS 실시간 재생 시도
   */
  if (isHlsUrl(item.url)) {
    const video = document.createElement("video");
    video.muted = true;
    video.autoplay = true;
    video.controls = true;
    video.playsInline = true;

    screen.appendChild(video);

    if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = url;
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({
        liveSyncDuration: 6,
        maxLiveSyncPlaybackRate: 1.5,
        enableWorker: true
      });

      hls.loadSource(url);
      hls.attachMedia(video);
      hlsPlayers.push(hls);

      hls.on(Hls.Events.ERROR, function(event, data) {
        if (data && data.fatal) {
          loading.style.display = "none";
          errorBox.classList.add("show");
        }
      });
    } else {
      loading.style.display = "none";
      errorBox.classList.add("show");
      return;
    }

    video.addEventListener("loadeddata", () => {
      loading.style.display = "none";
    });

    video.addEventListener("playing", () => {
      loading.style.display = "none";
    });

    video.addEventListener("error", () => {
      loading.style.display = "none";
      errorBox.classList.add("show");
    });

    setTimeout(() => {
      if (loading.style.display !== "none") {
        loading.style.display = "none";
      }
    }, 5000);

    return;
  }

  /**
   * 일반 웹 URL은 iframe 시도
   * 단, UTIC는 위에서 이미 차단 처리함.
   */
  const iframe = document.createElement("iframe");
  iframe.src = url;
  iframe.referrerPolicy = "no-referrer";
  iframe.allowFullscreen = true;
  iframe.loading = "lazy";

  screen.appendChild(iframe);

  iframe.addEventListener("load", () => {
    loading.style.display = "none";
  });

  setTimeout(() => {
    loading.style.display = "none";
  }, 4000);
}

function render(){
  clearHlsPlayers();
  dashboard.innerHTML = "";

  if (!items.length) {
    dashboard.innerHTML = `
      <div class="empty">
        표시할 CCTV 데이터가 없습니다.<br>
        대표CCTV 시트의 region / url 컬럼과 웹 게시 상태를 확인해 주세요.
      </div>
    `;
    countText.textContent = "0개";
    return;
  }

  items.forEach((item, index) => {
    const card = buildCard(item, index);
    dashboard.appendChild(card);
    mountViewer(card, item, index);
  });

  const now = new Date();
  const updated = items.find(x => x.updatedAt)?.updatedAt || "-";

  countText.textContent = `${items.length}개 권역`;
  subText.textContent = `마지막 화면 로드: ${now.toLocaleString("ko-KR")} · CCTV 데이터 갱신: ${updated}`;
}

function reloadOne(card, item, index){
  mountViewer(card, item, index);
  showToast(`${item.region} 리로드`);
}

function reloadAll(){
  render();
  showToast("전체 CCTV 리로드 완료");
}

async function loadData(){
  subText.textContent = "대표CCTV 데이터 로딩 중…";

  try{
    const res = await fetch(CSV_URL, { cache:"no-store" });
    if (!res.ok) throw new Error("CSV HTTP " + res.status);

    const text = await res.text();
    const rows = parseCSV(text);
    items = mapRows(rows);

    render();

  }catch(e){
    console.error(e);
    dashboard.innerHTML = `
      <div class="empty">
        CSV 로딩 실패<br>
        ${escapeHtml(e.message || e)}<br><br>
        구글시트 웹 게시 상태와 CSV_URL을 확인해 주세요.
      </div>
    `;
    subText.textContent = "CSV 로딩 실패";
    countText.textContent = "-";
  }
}

function startAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);

  if (!autoRefresh) {
    refreshText.textContent = "자동새로고침 OFF";
    autoBtn.textContent = "자동새로고침 OFF";
    autoBtn.classList.remove("on");
    return;
  }

  refreshText.textContent = `자동새로고침 ${refreshSec}초`;
  autoBtn.textContent = "자동새로고침 ON";
  autoBtn.classList.add("on");

  refreshTimer = setInterval(() => {
    loadData();
    showToast("자동 새로고침");
  }, refreshSec * 1000);
}

reloadBtn.addEventListener("click", () => {
  loadData();
});

autoBtn.addEventListener("click", () => {
  autoRefresh = !autoRefresh;
  startAutoRefresh();
  showToast(autoRefresh ? "자동새로고침 ON" : "자동새로고침 OFF");
});

fitBtn.addEventListener("click", () => {
  fitMode = !fitMode;

  if (fitMode) {
    dashboard.style.gridTemplateColumns = "repeat(4, minmax(220px, 1fr))";
    fitBtn.classList.add("on");
    showToast("화면맞춤 모드");
  } else {
    dashboard.style.gridTemplateColumns = "";
    fitBtn.classList.remove("on");
    showToast("기본 화면 모드");
  }
});

window.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "r") {
    e.preventDefault();
    loadData();
  }

  if (e.key === " ") {
    e.preventDefault();
    autoRefresh = !autoRefresh;
    startAutoRefresh();
  }
});

loadData();
startAutoRefresh();
</script>
